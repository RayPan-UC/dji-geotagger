[project]
name = "dji-geotagger"
version = "3.0.2"
description = "A precise PPK + MRK-based geotagging tool for DJI RTK drones"
authors = [{name = "Ray Pan", email = "hungwei.pan2@ucalgary.ca"}]
license = {text = "BSD-2-Clause"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pillow",
  # Required by Pillow's Image.getxmp(). Without it XMP is silently
  # unreadable, so every image yields "No metadata found" and the pipeline
  # produces nothing.
  "defusedxml",
  "pandas",
  "numpy",
  "pyproj",
  "tqdm",
  "requests",
  "georinex",
  "astropy",
  "pymap3d"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Recognition",
]

# Kept below the keys of [project]: a TOML table runs until the next header,
# so anything after this one belongs to it.
[project.optional-dependencies]
# The desktop front end. Kept out of the base install so that a headless
# script - or a CI job - does not pull in a GUI toolkit it will never open.
#   pip install dji-geotagger[gui]
gui = ["pywebview>=5"]

[project.urls]
"Homepage" = "https://github.com/geo-raypan/dji-geotagger"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# Without this, setuptools' namespace discovery packages every top-level
# directory, including ones that are gitignored precisely because they hold
# local scratch work - test/ and others/ shipped in the 2.1.0 build before
# this was added. .gitignore does not constrain a build.
include = ["dji_geotagger*"]

# The front end is HTML, CSS, JavaScript and a vendored copy of Leaflet. None
# of it is a Python package, so nothing above picks it up - and without it an
# installed copy opens a window with no content.
[tool.setuptools.package-data]
"dji_geotagger.gui" = [
  "web/*.html", "web/*.css", "web/*.js",
  "web/vendor/*.css", "web/vendor/*.js", "web/vendor/images/*",
]